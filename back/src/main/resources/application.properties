spring.application.name=talento-humano

# Configuración de base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/unexca_talento_humano?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
# La contraseña real se carga de la variable de entorno DB_PASSWORD (NUNCA comitear la real).
# El valor por defecto es SOLO para la BD local de desarrollo.
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración de JWT (HS256).
# El secreto se carga de la variable de entorno APP_JWT_SECRET (NUNCA comitear el real).
# El valor por defecto es SOLO para desarrollo local; el arranque falla si tiene < 32 bytes
# o si conserva el placeholder de ejemplo (ver JwtService#validarSecreto).
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-local-2026-unexca-talento-humano-32b}
app.jwt.exp-minutes=120
app.jwt.exp-minutes-recordarme=10080

# Sembrar empleado de prueba al arrancar. Desactivado por defecto.
# Para desarrollo local: arrancar con APP_SEED_DEMO=true (o -Dapp.seed-demo=true).
app.seed-demo=${APP_SEED_DEMO:false}
