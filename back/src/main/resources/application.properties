spring.application.name=talento-humano

# Configuración de base de datos PostgreSQL (Supabase en producción).
# La URL real se carga de DB_URL; el valor por defecto es SOLO para la BD local.
#
# Para Supabase hay exactamente UNA combinación que funciona desde Render
# (las otras dos se probaron y fallan):
#   - db.<ref>.supabase.co:5432  -> el host solo tiene registro AAAA (IPv6). No sirve.
#   - pooler ...:5432 (sesión)   -> conecta por TCP pero nunca responde. No sirve.
#   - pooler ...:6543 (transac.) -> OK. Es la que hay que usar.
# El pooler en modo transacción es PgBouncer, así que la URL DEBE llevar
# prepareThreshold=0: si no, el driver usa prepared statements del lado del
# servidor y PgBouncer los rompe al reciclar la conexión entre transacciones.
#   DB_URL=jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
#   DB_USERNAME=postgres.<ref>     <-- el usuario del pooler lleva el ref del proyecto
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/unexca_talento_humano}
spring.datasource.username=${DB_USERNAME:postgres}
# La contraseña real se carga de la variable de entorno DB_PASSWORD (NUNCA comitear la real).
# El valor por defecto es SOLO para la BD local de desarrollo.
spring.datasource.password=${DB_PASSWORD:1234}

# El pooler de Supabase reparte pocas conexiones entre todos los clientes.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# Configuración de JPA / Hibernate.
# El dialecto lo detecta Hibernate solo a partir del driver; no lo fijamos a mano
# para que no vuelva a quedar desincronizado con la base real.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuración de JWT (HS256).
# El secreto se carga de la variable de entorno APP_JWT_SECRET (NUNCA comitear el real).
# El valor por defecto es SOLO para desarrollo local; el arranque falla si tiene < 32 bytes
# o si conserva el placeholder de ejemplo (ver JwtService#validarSecreto).
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-local-2026-unexca-talento-humano-32b}
app.jwt.exp-minutes=120
app.jwt.exp-minutes-recordarme=10080

# Sembrar empleado de prueba al arrancar. Desactivado por defecto.
# Para desarrollo local: arrancar con APP_SEED_DEMO=true (o -Dapp.seed-demo=true).
app.seed-demo=${APP_SEED_DEMO:false}
#Server port para renderizar en Render. Se puede cambiar con la variable de entorno PORT (ej: heroku). Por defecto 8080.
server.port=${PORT:8080}

# CORS: orígenes autorizados del front. En Render se sobreescribe con la env var
# CORS_ALLOWED_ORIGINS (la URL de Vercel, separada por comas). Default = dev local.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# Atributos de la cookie del JWT (TokenCookieFactory).
# Local: Lax/false. Producción (Vercel + Render, dominios distintos): None/true,
# vía las env vars COOKIE_SAME_SITE=None y COOKIE_SECURE=true.
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}