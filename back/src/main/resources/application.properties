spring.application.name=talento-humano

# Configuración de base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/unexca_talento_humano?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración de JWT (HS256). El secreto DEBE tener >= 32 caracteres.
app.jwt.secret=cambia-este-secreto-por-uno-largo-de-32-o-mas-bytes
app.jwt.exp-minutes=120
app.jwt.exp-minutes-recordarme=10080
# Sembrar empleado de prueba al arrancar (solo desarrollo)
app.seed-demo=true
