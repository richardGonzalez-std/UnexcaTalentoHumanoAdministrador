<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talento Humano · UNEXCA — Ingresar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --card: #121214;
    --card-border: rgba(255, 255, 255, 0.08);
    --field-bg: #18181b;
    --field-border: rgba(255, 255, 255, 0.10);
    --field-border-focus: #2563eb;
    --text: #f4f4f5;
    --text-dim: #a1a1aa;
    --text-faint: #71717a;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --error: #f87171;
    --error-bg: rgba(248, 113, 113, 0.08);
    --error-border: rgba(248, 113, 113, 0.22);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    position: relative;
    overflow: hidden;
  }

  /* subtle gradient glow */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(900px 600px at 50% -10%, rgba(37, 99, 235, 0.14), transparent 60%),
      radial-gradient(700px 500px at 80% 110%, rgba(37, 99, 235, 0.06), transparent 55%),
      linear-gradient(180deg, #0c0c0e 0%, #080808 100%);
    pointer-events: none;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 408px;
    background: linear-gradient(180deg, rgba(255,255,255,0.015), rgba(255,255,255,0) 40%), var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 40px 36px 36px;
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.04) inset,
      0 24px 60px -20px rgba(0, 0, 0, 0.8),
      0 8px 24px -12px rgba(0, 0, 0, 0.6);
  }

  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    margin-bottom: 32px;
  }

  /* LOGO placeholder */
  .logo-slot {
    height: 64px;
    width: 188px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px dashed rgba(255, 255, 255, 0.16);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.02);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.22em;
    color: var(--text-faint);
  }

  .subtitle {
    font-size: 13.5px;
    font-weight: 500;
    letter-spacing: 0.01em;
    color: var(--text-dim);
  }

  form { display: flex; flex-direction: column; gap: 18px; }

  .field { display: flex; flex-direction: column; gap: 7px; }

  .field label {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dim);
  }

  .input-wrap { position: relative; display: flex; align-items: center; }

  input[type="text"],
  input[type="password"] {
    width: 100%;
    height: 46px;
    background: var(--field-bg);
    border: 1px solid var(--field-border);
    border-radius: 11px;
    padding: 0 14px;
    color: var(--text);
    font-family: inherit;
    font-size: 14.5px;
    transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
  }

  .input-wrap.has-toggle input { padding-right: 46px; }

  input::placeholder { color: #52525b; }

  input:focus {
    outline: none;
    border-color: var(--field-border-focus);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
    background: #1b1b1f;
  }

  .toggle-eye {
    position: absolute;
    right: 6px;
    height: 34px;
    width: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    color: var(--text-faint);
    cursor: pointer;
    border-radius: 8px;
    transition: color 0.15s ease, background 0.15s ease;
  }
  .toggle-eye:hover { color: var(--text-dim); background: rgba(255,255,255,0.04); }
  .toggle-eye:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .remember {
    display: flex;
    align-items: center;
    gap: 9px;
    user-select: none;
    cursor: pointer;
    width: fit-content;
    margin-top: -2px;
  }

  .remember input { position: absolute; opacity: 0; width: 0; height: 0; }

  .checkbox {
    width: 18px;
    height: 18px;
    border-radius: 5px;
    border: 1px solid var(--field-border);
    background: var(--field-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, border-color 0.15s ease;
    flex-shrink: 0;
  }
  .checkbox svg { opacity: 0; transform: scale(0.6); transition: opacity 0.14s ease, transform 0.14s ease; }
  .remember input:checked + .checkbox { background: var(--accent); border-color: var(--accent); }
  .remember input:checked + .checkbox svg { opacity: 1; transform: scale(1); }
  .remember input:focus-visible + .checkbox { box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18); }

  .remember span { font-size: 13.5px; color: var(--text-dim); }

  .btn {
    height: 48px;
    border: none;
    border-radius: 11px;
    background: var(--accent);
    color: #fff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
    cursor: pointer;
    margin-top: 4px;
    transition: background 0.15s ease, transform 0.08s ease, box-shadow 0.15s ease;
    box-shadow: 0 8px 20px -8px rgba(37, 99, 235, 0.6);
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid #93c5fd; outline-offset: 2px; }

  /* error message slot */
  .error {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 13px;
    font-weight: 500;
    color: var(--error);
    background: var(--error-bg);
    border: 1px solid var(--error-border);
    border-radius: 10px;
    padding: 11px 13px;
    margin-top: 2px;
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    padding-top: 0;
    padding-bottom: 0;
    border-width: 0;
    transition: opacity 0.2s ease, max-height 0.25s ease, padding 0.25s ease, border-width 0.2s ease;
  }
  .error.show {
    opacity: 1;
    max-height: 60px;
    padding-top: 11px;
    padding-bottom: 11px;
    border-width: 1px;
  }
  .error svg { flex-shrink: 0; }

  @media (max-width: 440px) {
    .card { padding: 32px 22px 28px; border-radius: 18px; }
    .logo-slot { width: 160px; }
  }
</style>
</head>
<body>
  <main class="card" role="main">
    <div class="brand">
      <div class="logo-slot" aria-label="Espacio reservado para el logo">LOGO</div>
      <p class="subtitle">Talento Humano · UNEXCA</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="cedula">Cédula</label>
        <div class="input-wrap">
          <input type="text" id="cedula" name="cedula" placeholder="V-12345678" autocomplete="username" inputmode="text">
        </div>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <div class="input-wrap has-toggle">
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="toggle-eye" id="togglePassword" aria-label="Mostrar contraseña" aria-pressed="false">
            <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <label class="remember">
        <input type="checkbox" id="remember" name="remember">
        <span class="checkbox">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </span>
        <span>Recordarme</span>
      </label>

      <button type="submit" class="btn">Ingresar</button>

      <div class="error" id="errorMsg" role="alert" aria-live="polite">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        <span>Cédula o contraseña incorrectas</span>
      </div>
    </form>
  </main>

<script>
  (function () {
    const pw = document.getElementById('password');
    const toggle = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');

    const eyeOpen = '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle>';
    const eyeOff = '<path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19"></path><path d="M6.61 6.61A18.4 18.4 0 0 0 2 12s3.5 7 10 7a9.12 9.12 0 0 0 5.39-1.61"></path><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1="2" y1="2" x2="22" y2="22"></line>';

    toggle.addEventListener('click', function () {
      const show = pw.type === 'password';
      pw.type = show ? 'text' : 'password';
      eyeIcon.innerHTML = show ? eyeOff : eyeOpen;
      toggle.setAttribute('aria-pressed', String(show));
      toggle.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
    });

    // Demo: any submit surfaces the error slot so the styling is visible.
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      errorMsg.classList.add('show');
    });

    // Hide error again as soon as the user edits a field.
    [document.getElementById('cedula'), pw].forEach(function (el) {
      el.addEventListener('input', function () { errorMsg.classList.remove('show'); });
    });
  })();
</script>
</body>
</html>
