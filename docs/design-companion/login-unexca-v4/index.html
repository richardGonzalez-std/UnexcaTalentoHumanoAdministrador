<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Talento Humano · UNEXCA — Ingreso (Propuesta 4)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Tektur:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --navy:#002e6b;
    --slate:#2b3d4f;
    --card:#ffffff;
    --soft:#f4f7fb;       /* fondo de inputs */
    --ink:#16263b;        /* texto principal oscuro */
    --muted:#647691;      /* texto secundario */
    --line:#dde5ef;       /* bordes claros */
    --accent:#00337c;
    --accent-2:#1657b0;
    --danger:#c0392b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Tektur',system-ui,sans-serif;
    font-weight:500;
    color:var(--ink);
    background:var(--navy);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;display:grid;place-items:center;padding:28px;
  }
  /* fondo: degradado #002e6b → #2b3d4f, SIN glow */
  body::before{
    content:"";position:absolute;inset:0;z-index:0;
    background:linear-gradient(168deg, var(--navy) 0%, var(--slate) 100%);
  }

  .shell{position:relative;z-index:1;width:100%;max-width:408px;display:flex;flex-direction:column;align-items:center}

  /* logo blanco sobre la zona azul, encima de la tarjeta */
  .logo{margin-bottom:22px}
  .logo img{height:58px;width:auto;display:block;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35))}

  .card{
    width:100%;background:var(--card);border-radius:20px;
    padding:38px 36px 32px;
    box-shadow:0 30px 70px -28px rgba(0,18,50,.55);
  }

  .head{text-align:center;margin-bottom:26px}
  .kicker{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-2);font-weight:600}
  .title{font-weight:500;font-size:27px;line-height:1.12;margin-top:9px;letter-spacing:-.01em;color:var(--ink)}
  .sub{color:var(--muted);font-size:13.5px;margin-top:8px;font-weight:400}

  form{display:flex;flex-direction:column;gap:16px}
  .field label{display:block;font-size:12px;font-weight:600;color:#2c405a;margin-bottom:7px;letter-spacing:.03em;text-transform:uppercase}
  .control{position:relative}
  .control input{
    width:100%;height:50px;border-radius:12px;background:var(--soft);
    border:1px solid var(--line);color:var(--ink);
    padding:0 16px;font-size:15px;font-family:inherit;font-weight:400;
    transition:border-color .18s, box-shadow .18s, background .18s;
  }
  .control input::placeholder{color:#9aa9bd;font-weight:400}
  .control input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(0,51,124,.13);background:#fff}
  .pw-input{padding-right:48px}
  .toggle{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    height:36px;width:36px;border:0;border-radius:9px;background:transparent;color:#8493a8;
    cursor:pointer;display:grid;place-items:center;transition:color .15s, background .15s;
  }
  .toggle:hover{color:var(--ink);background:#eef2f8}
  .toggle svg{width:19px;height:19px;position:absolute;transition:opacity .15s, transform .15s}
  .ico-off{opacity:0;transform:scale(.85)}
  .toggle.on .ico-on{opacity:0;transform:scale(.85)}
  .toggle.on .ico-off{opacity:1;transform:scale(1)}

  .row{display:flex;align-items:center;justify-content:flex-start;margin-top:1px}
  .check{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;font-size:13.5px;color:#3a4d66;font-weight:500}
  .check input{position:absolute;opacity:0;width:0;height:0}
  .box{width:20px;height:20px;border-radius:6px;border:1.5px solid #c2cee0;background:#fff;display:grid;place-items:center;transition:.15s}
  .check input:checked + .box{background:var(--accent);border-color:var(--accent)}
  .box svg{width:12px;height:12px;opacity:0;transform:scale(.6);transition:.15s;color:#fff}
  .check input:checked + .box svg{opacity:1;transform:scale(1)}

  .btn{
    margin-top:8px;height:52px;border:0;border-radius:12px;cursor:pointer;
    font-family:inherit;font-weight:600;font-size:15px;letter-spacing:.02em;color:#fff;
    background:linear-gradient(168deg, #0a3f93, var(--navy));
    box-shadow:0 12px 26px -10px rgba(0,46,107,.6);
    display:flex;align-items:center;justify-content:center;gap:10px;
    transition:transform .12s, box-shadow .18s, filter .18s;
  }
  .btn:hover{filter:brightness(1.08);box-shadow:0 14px 30px -10px rgba(0,46,107,.7)}
  .btn:active{transform:translateY(1px)}
  .btn[disabled]{cursor:progress;filter:saturate(.7) brightness(.95)}
  .spin{width:17px;height:17px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite;display:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  .btn.loading .spin{display:block}
  .btn.loading .btn-label{opacity:.7}

  .error{
    display:none;align-items:center;gap:9px;margin-top:3px;color:var(--danger);font-size:13px;font-weight:500;
    background:#fcecea;border:1px solid #f3c9c4;padding:11px 13px;border-radius:10px;
  }
  .error.show{display:flex;animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

  .demo-badge{
    position:fixed;top:14px;right:16px;z-index:5;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:#d4e0f2;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 11px;background:rgba(0,0,0,.18);backdrop-filter:blur(4px);
  }
</style>
</head>
<body>
  <span class="demo-badge">Propuesta 4 · vista de diseño</span>

  <div class="shell">
    <div class="logo"><img src="./logo.png" alt="UNEXCA" /></div>

    <div class="card">
      <div class="head">
        <div class="kicker">Talento Humano · UNEXCA</div>
        <h1 class="title">Iniciar sesión</h1>
        <p class="sub">Ingresa con tu cédula y contraseña.</p>
      </div>

      <form id="form" novalidate>
        <div class="field">
          <label for="cedula">Cédula</label>
          <div class="control">
            <input id="cedula" name="cedula" type="text" placeholder="V-12345678" autocomplete="username" />
          </div>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <div class="control">
            <input id="password" name="password" class="pw-input" type="password" placeholder="••••••••••" autocomplete="current-password" />
            <button class="toggle" type="button" id="toggle" aria-label="Mostrar contraseña">
              <svg class="ico-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="ico-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3l18 18M10.6 5.1A9.8 9.8 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.3 4M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 4.2-.95M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            </button>
          </div>
        </div>

        <div class="row">
          <label class="check">
            <input type="checkbox" id="recordarme" />
            <span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4"><path d="M20 6 9 17l-5-5"/></svg></span>
            Recordarme
          </label>
        </div>

        <button class="btn" type="submit" id="submit">
          <span class="spin"></span>
          <span class="btn-label">Ingresar</span>
        </button>

        <div class="error" id="error">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:17px;height:17px;flex:none"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
          Cédula o contraseña incorrectas
        </div>
      </form>
    </div>
  </div>

<script>
  const pw = document.getElementById('password');
  const toggle = document.getElementById('toggle');
  toggle.addEventListener('click', () => {
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    toggle.classList.toggle('on', show);
    toggle.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
  });

  const form = document.getElementById('form');
  const btn = document.getElementById('submit');
  const error = document.getElementById('error');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    error.classList.remove('show');
    btn.classList.add('loading'); btn.disabled = true;
    setTimeout(() => {
      btn.classList.remove('loading'); btn.disabled = false;
      error.classList.add('show');
    }, 1100);
  });
</script>
</body>
</html>
