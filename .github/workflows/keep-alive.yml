name: Keep Backend Alive

on:
  schedule:
    # Cada 14 minutos (Render duerme tras 15 min de inactividad)
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          echo "=== ping $(date -u +'%Y-%m-%d %H:%M:%SZ') ==="
          BODY=$(mktemp)

          START=$(date +%s)
          set +e
          STATUS=$(curl -s -o "$BODY" -w "%{http_code}" \
            --max-time 60 \
            --connect-timeout 15 \
            -H "Accept: application/json" \
            https://unexcatalentohumanoadministradorapi.onrender.com/api/health)
          CURL_EXIT=$?
          set -e
          ELAPSED=$(( $(date +%s) - START ))

          echo "curl_exit=$CURL_EXIT  http=$STATUS  tiempo=${ELAPSED}s"

          if [ "$CURL_EXIT" = "28" ]; then
            echo "TIMEOUT: sin respuesta en 60s — Render cold start demasiado lento, revisar plan"
          elif [ "$CURL_EXIT" != "0" ]; then
            echo "ERROR red (curl $CURL_EXIT) — respuesta:"
            cat "$BODY"
          elif [ "$STATUS" = "200" ]; then
            echo "OK — backend respondió en ${ELAPSED}s"
          else
            echo "HTTP $STATUS en ${ELAPSED}s — respuesta:"
            cat "$BODY"
          fi

          rm -f "$BODY"
          exit 0
